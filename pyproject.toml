[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maehbot"
version = "0.1.0"
description = "Weed detection and micro-dosing nozzle for lawn mower robot"
readme = "README.md"
# 3.11 for older nodes (e.g. Pi 1 B+ on Bookworm); 3.12 target on Pi 5
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
core = [
    "picamera2>=0.3.0; platform_system=='Linux'",
    "lgpio>=0.2.0; platform_system=='Linux'",
]
# SLAM mapping additionally requires BreezySLAM, which is not on PyPI.
# Install it from source on the drive node (see docs/mapping-navigation.md):
#   git clone https://github.com/simondlevy/BreezySLAM
#   pip install ./BreezySLAM/python
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "httpx>=0.27",
]
training = [
    "opencv-python-headless>=4.9,<5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
maehbot-core = "core.main:main"
maehbot-web = "web.backend.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["maehbot*", "vision*", "spray*", "drive*", "storage*", "training*", "core*", "web*", "navigation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pi: tests requiring Raspberry Pi hardware",
]
