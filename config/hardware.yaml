# GPIO BCM pin numbers — adjust on the Pi via config/local.yaml
gpio:
  nozzle_valve: 17
  pump: 27
  tank_full: 22
  tank_empty: 23

# TB6612FNG motor driver pins (BCM). Left track = channel A, right track = channel B.
# Pi pin header (physical) references in comments for wiring convenience.
motor:
  standby: 25      # STBY  (physical pin 22) — HIGH enables both channels
  left_in1: 5      # AIN1  (physical pin 29)
  left_in2: 6      # AIN2  (physical pin 31)
  left_pwm: 12     # PWMA  (physical pin 32)
  right_in1: 16    # BIN1  (physical pin 36)
  right_in2: 26    # BIN2  (physical pin 37)
  right_pwm: 13    # PWMB  (physical pin 33)
  pwm_frequency_hz: 1000

# Spray servos (BCM). Signal pins only — power the servos from an external
# 5-6 V supply (NOT the Pi 5V rail) with common ground to the Pi.
# Calibrate angle range / pulse widths per servo type in config/local.yaml.
servo:
  pwm_frequency_hz: 50
  step_delay_ms: 800   # wait between sequence steps so servos finish moving
  position:            # servo 1 — nozzle positioning
    pin: 18            # physical pin 12
    min_angle: -180
    max_angle: 180
    min_pulse_us: 500
    max_pulse_us: 2500
  tension:             # servo 2 — pressure/tension servo
    pin: 19            # physical pin 35
    min_angle: -45
    max_angle: 180
    min_pulse_us: 500
    max_pulse_us: 2500
  trigger:             # servo 3 — actuation mechanism
    pin: 20            # physical pin 38
    min_angle: 0
    max_angle: 45
    min_pulse_us: 500
    max_pulse_us: 2500
