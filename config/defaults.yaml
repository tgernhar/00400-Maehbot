# Maehbot default configuration
# Override per machine in config/local.yaml (gitignored)

# --- Node role (multi-device split) ---
# Roles are pure config so hardware can be swapped for newer Pis without
# code changes. Set per device in config/local.yaml:
#   all    = everything on one device (default)
#   drive  = motors + camera preview only (teleoperation node)
#   vision = detection + spray + training only (weed-control node)
node:
  role: all
  peers:
    vision_url: ""   # e.g. http://maehbot-vision.local:8080 (used by drive node's web UI)

# --- Spray & motion ---
spray:
  delay_ms: 0              # user delay added before travel time
  duration_ms: 100         # GPIO active duration for nozzle + pump
  camera_to_nozzle_mm: 20  # distance camera → nozzle along travel axis
  mower_speed_mm_s: 100    # 0.1 m/s

# --- Spray servos: editable test sequence on the "Sprühen" page ---
# Pins and calibration live in config/hardware.yaml (section: servo).
servo:
  test_sequence:
    - {servo: tension, angle: 0}
    - {servo: position, angle: 0}
    - {servo: trigger, angle: 0}
    - {servo: trigger, angle: 0}
    - {servo: tension, angle: -45}
    - {servo: position, angle: 0}
    - {servo: tension, angle: 0}
    - {servo: trigger, angle: 0}
  hold_until_step:
    position: null
    tension: null
    trigger: null

# --- Drive (tank chassis via TB6612FNG) ---
drive:
  enabled: true            # false = motors stay disabled (STBY low)
  max_speed: 1.0           # global speed cap, 0..1 (scales PWM duty)
  watchdog_timeout_ms: 1000  # stop motors if no command within this window
  invert_left: false       # flip direction if a track runs backwards
  invert_right: false

# --- LiDAR (LDRobot D500 via USB adapter) ---
lidar:
  enabled: true
  port: /dev/ttyUSB0
  baud: 230400
  angle_offset_deg: 0    # rotate scan if sensor is not mounted front-aligned
  preview_fps: 2         # lidar.jpg refresh rate for the web UI
  preview_range_m: 4.0   # display radius of the preview image

# --- Area coverage (outward rectangular spiral, "Bereich abfahren") ---
# Time-based dead reckoning until wheel encoders exist: speed_m_s and
# pivot_deg_s are CALIBRATION values measured on the real robot.
coverage:
  drive_speed: 0.5         # track speed while driving straight (0..1)
  turn_speed: 0.5          # track speed while pivoting in place (0..1)
  speed_m_s: 0.10          # CALIBRATE: ground speed in m/s at drive_speed
  pivot_deg_s: 45.0        # CALIBRATE: rotation rate in deg/s at turn_speed
  first_leg_m: 0.20        # first spiral segment
  second_leg_m: 0.15       # second spiral segment
  track_spacing_m: 0.15    # lane distance; every leg = leg two steps back + this
  turn_direction: left     # left | right
  obstacle_stop_m: 0.30    # stop when LiDAR sees something closer than this
  obstacle_sector_deg: 60  # front sector width checked for obstacles
  obstacle_wait_s: 3.0     # wait before trying to avoid (obstacle may move)
  detour_m: 0.30           # sidestep distance when avoiding
  max_avoid_attempts: 3    # abort run after this many failed avoidances

# --- Camera ---
camera:
  source: auto     # auto | picamera2 | usb | mock (auto = picamera2 if available)
  fps: 30
  preview_fps: 15  # live preview refresh rate (single preview.jpg on disk)
  width: 640
  height: 480
  usb_device: 0    # V4L2 index when source: usb

# --- Detection ---
detection:
  min_confidence: 0.75
  inference_target: imx500  # imx500 | pi_cpu

# Plant classes: id, name, sprayable
classes:
  - id: grass
    name: Grass
    sprayable: false
  - id: clover
    name: Clover
    sprayable: true
  - id: dandelion
    name: Dandelion
    sprayable: true
  - id: unknown_weed
    name: Unknown weed
    sprayable: true

# --- Mode ---
mode:
  test_mode: true          # true = detect only, no GPIO spray

# --- Storage ---
storage:
  root_path: /var/lib/maehbot
  ui_detection_limit: 100
  max_archived_images: 1000
  max_total_bytes: 10737418240  # 10 GB

# --- Web / API ---
web:
  host: "0.0.0.0"
  port: 8080
  auth_enabled: false        # skip auth for early testing
  local_wlan_only: true

# --- GPIO (pins set in config/hardware.yaml or local.yaml) ---
# hardware.yaml example structure — copy to local.yaml with real BCM pins:
# gpio:
#   nozzle_valve: 17
#   pump: 27
#   tank_full: 22
#   tank_empty: 23
